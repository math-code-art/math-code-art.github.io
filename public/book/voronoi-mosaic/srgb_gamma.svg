<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="460" height="360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="460" height="360" fill="#ffffff"/>
  <text x="230" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#17171c">sRGB → linear (gamma) correction</text>

  <!-- plot frame -->
  <line x1="70" y1="60" x2="70" y2="300" stroke="#17171c" stroke-width="1.5"/>
  <line x1="70" y1="300" x2="380" y2="300" stroke="#17171c" stroke-width="1.5"/>

  <!-- axis ticks -->
  <text x="66" y="305" text-anchor="end" font-size="12" fill="#52525b">0</text>
  <text x="66" y="64" text-anchor="end" font-size="12" fill="#52525b">1</text>
  <text x="380" y="318" text-anchor="middle" font-size="12" fill="#52525b">1</text>

  <!-- diagonal reference y = x -->
  <line x1="70" y1="300" x2="380" y2="60" stroke="#52525b" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- sRGB -> linear curve -->
  <polyline fill="none" stroke="#0f766e" stroke-width="2.6"
    points="70,300 100,297.6 131,292.2 162,282.6 193,268.2 224,248.8 255,223.8 286,192.6 317,155.1 348,111.1 380,60"/>

  <!-- labels on curves -->
  <text x="300" y="120" font-size="12.5" fill="#0f766e" font-weight="600">sRGB → linear</text>
  <text x="150" y="150" font-size="12" fill="#52525b">y = x (raw luma)</text>

  <!-- axis titles -->
  <text x="225" y="342" text-anchor="middle" font-size="13" fill="#17171c">encoded sRGB value (stored in the file)</text>
  <text x="22" y="180" text-anchor="middle" font-size="13" fill="#17171c" transform="rotate(-90 22 180)">linear light (physical)</text>
</svg>
