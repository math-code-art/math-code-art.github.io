<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="620" height="330" fill="#ffffff"/>
  <text x="310" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#17171c">Why many frequencies? Coarse and fine position at once</text>

  <!-- baselines -->
  <line x1="60" y1="95" x2="560" y2="95" stroke="#e3e3ea" stroke-width="1"/>
  <line x1="60" y1="235" x2="560" y2="235" stroke="#e3e3ea" stroke-width="1"/>

  <!-- two nearby positions -->
  <line x1="175" y1="42" x2="175" y2="292" stroke="#52525b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="205" y1="42" x2="205" y2="292" stroke="#52525b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="171" y="40" text-anchor="end" font-size="11" fill="#17171c">x</text>
  <text x="209" y="40" text-anchor="start" font-size="11" fill="#17171c">x+Δ</text>

  <!-- low frequency wave -->
  <polyline fill="none" stroke="#0f766e" stroke-width="2.4" points="60,95.0 70,89.7 80,84.6 90,79.5 100,74.8 110,70.3 120,66.2 130,62.6 140,59.5 150,57.0 160,55.1 170,53.7 180,53.1 190,53.1 200,53.7 210,55.1 220,57.0 230,59.5 240,62.6 250,66.2 260,70.3 270,74.8 280,79.5 290,84.6 300,89.7 310,95.0 320,100.3 330,105.4 340,110.5 350,115.2 360,119.7 370,123.8 380,127.4 390,130.5 400,133.0 410,134.9 420,136.3 430,136.9 440,136.9 450,136.3 460,134.9 470,133.0 480,130.5 490,127.4 500,123.8 510,119.7 520,115.2 530,110.5 540,105.4 550,100.3 560,95.0"/>
  <circle cx="175" cy="53.3" r="4" fill="#0f766e" stroke="#ffffff" stroke-width="1.3"/>
  <circle cx="205" cy="54.3" r="4" fill="#0f766e" stroke="#ffffff" stroke-width="1.3"/>
  <text x="575" y="70" font-size="11.5" font-weight="600" fill="#17171c">low freq</text>
  <text x="310" y="162" text-anchor="middle" font-size="11.5" fill="#52525b">nearby points → almost the same value  (coarse position)</text>

  <!-- high frequency wave -->
  <polyline fill="none" stroke="#0f766e" stroke-width="2.4" points="60,235.0 70,206.2 80,193.1 90,202.6 100,229.7 110,259.7 120,276.3 130,270.5 140,245.4 150,214.8 160,195.1 170,197.0 180,219.5 190,250.5 200,273.0 210,274.9 220,255.2 230,224.6 240,199.5 250,193.7 260,210.3 270,240.3 280,267.4 290,276.9 300,263.8 310,235.0 320,206.2 330,193.1 340,202.6 350,229.7 360,259.7 370,276.3 380,270.5 390,245.4 400,214.8 410,195.1 420,197.0 430,219.5 440,250.5 450,273.0 460,274.9 470,255.2 480,224.6 490,199.5 500,193.7 510,210.3 520,240.3 530,267.4 540,276.9 550,263.8 560,235.0"/>
  <circle cx="175" cy="206.2" r="4" fill="#0f766e" stroke="#ffffff" stroke-width="1.3"/>
  <circle cx="205" cy="276.9" r="4" fill="#0f766e" stroke="#ffffff" stroke-width="1.3"/>
  <text x="575" y="210" font-size="11.5" font-weight="600" fill="#17171c">high freq</text>
  <text x="310" y="304" text-anchor="middle" font-size="11.5" fill="#52525b">nearby points → very different values  (fine position)</text>

  <text x="310" y="324" text-anchor="middle" font-size="11" fill="#52525b">position along the image →</text>
</svg>
