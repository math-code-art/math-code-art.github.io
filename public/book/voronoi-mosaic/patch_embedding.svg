<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" width="480" height="220" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="pa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#52525b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="480" height="220" fill="#ffffff"/>
  <text x="240" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#17171c">From pixels to tokens</text>

  <!-- image with 4x4 grid -->
  <rect x="26" y="46" width="112" height="112" fill="#eef0f3" stroke="#17171c" stroke-width="1.5"/>
  <g stroke="#b9bcc6" stroke-width="1">
    <line x1="54" y1="46" x2="54" y2="158"/><line x1="82" y1="46" x2="82" y2="158"/><line x1="110" y1="46" x2="110" y2="158"/>
    <line x1="26" y1="74" x2="138" y2="74"/><line x1="26" y1="102" x2="138" y2="102"/><line x1="26" y1="130" x2="138" y2="130"/>
  </g>
  <rect x="82" y="74" width="28" height="28" fill="#0f766e" fill-opacity="0.85" stroke="#0f766e" stroke-width="1.5"/>
  <text x="82" y="178" text-anchor="middle" font-size="11" fill="#52525b">16×16 patches</text>

  <!-- flatten arrow -->
  <line x1="144" y1="102" x2="188" y2="102" stroke="#52525b" stroke-width="1.8" marker-end="url(#pa)"/>
  <text x="166" y="92" text-anchor="middle" font-size="11" fill="#17171c">flatten</text>

  <!-- flattened 768-vector -->
  <rect x="194" y="46" width="22" height="112" fill="#ffffff" stroke="#17171c" stroke-width="1.3"/>
  <g stroke="#d0d0da" stroke-width="1">
    <line x1="194" y1="60" x2="216" y2="60"/><line x1="194" y1="74" x2="216" y2="74"/><line x1="194" y1="88" x2="216" y2="88"/><line x1="194" y1="102" x2="216" y2="102"/><line x1="194" y1="116" x2="216" y2="116"/><line x1="194" y1="130" x2="216" y2="130"/><line x1="194" y1="144" x2="216" y2="144"/>
  </g>
  <text x="205" y="178" text-anchor="middle" font-size="11" fill="#52525b">768 values</text>

  <!-- x We arrow -->
  <line x1="222" y1="102" x2="266" y2="102" stroke="#52525b" stroke-width="1.8" marker-end="url(#pa)"/>
  <text x="244" y="92" text-anchor="middle" font-size="11.5" fill="#17171c">× Wₑ</text>

  <!-- embedding e_i -->
  <rect x="272" y="66" width="20" height="72" fill="#ffffff" stroke="#17171c" stroke-width="1.3"/>
  <g stroke="#d0d0da" stroke-width="1">
    <line x1="272" y1="84" x2="292" y2="84"/><line x1="272" y1="102" x2="292" y2="102"/><line x1="272" y1="120" x2="292" y2="120"/>
  </g>
  <text x="282" y="178" text-anchor="middle" font-size="12" fill="#52525b">eᵢ</text>

  <!-- + pos_i -->
  <text x="306" y="107" text-anchor="middle" font-size="18" fill="#52525b">+</text>
  <rect x="318" y="74" width="18" height="56" fill="#f6f6f8" stroke="#17171c" stroke-width="1.3"/>
  <text x="327" y="178" text-anchor="middle" font-size="11" fill="#52525b">posᵢ</text>

  <!-- add arrow -->
  <line x1="344" y1="102" x2="388" y2="102" stroke="#52525b" stroke-width="1.8" marker-end="url(#pa)"/>
  <text x="366" y="92" text-anchor="middle" font-size="11" fill="#17171c">add</text>

  <!-- token -->
  <rect x="394" y="66" width="24" height="72" fill="#0f766e" fill-opacity="0.10" stroke="#0f766e" stroke-width="1.8"/>
  <text x="406" y="178" text-anchor="middle" font-size="11.5" fill="#0f766e" font-weight="600">token</text>
  <text x="406" y="192" text-anchor="middle" font-size="10.5" fill="#52525b">eᵢ + posᵢ</text>
</svg>
