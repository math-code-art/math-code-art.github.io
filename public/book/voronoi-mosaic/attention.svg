<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="aa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#52525b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="250" fill="#ffffff"/>
  <text x="300" y="18" text-anchor="middle" font-size="15" font-weight="600" fill="#17171c">Attention — a query mixes values by relevance</text>

  <!-- column headers -->
  <text x="145" y="36" text-anchor="middle" font-size="11" fill="#52525b">keys · qᵢ·kⱼ</text>
  <text x="250" y="36" text-anchor="middle" font-size="11" fill="#52525b">softmax → wⱼ</text>
  <text x="355" y="36" text-anchor="middle" font-size="11" fill="#52525b">values vⱼ</text>

  <!-- query -->
  <rect x="16" y="96" width="58" height="58" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="45" y="121" text-anchor="middle" font-size="12" font-weight="600" fill="#0f766e">query</text>
  <text x="45" y="139" text-anchor="middle" font-size="12" fill="#0f766e">qᵢ</text>

  <!-- rows: keys, weight bars, values -->
  <!-- row 1 (yc=52) -->
  <line x1="74" y1="125" x2="120" y2="52" stroke="#b9bcc6" stroke-width="1.2"/>
  <rect x="120" y="38" width="50" height="28" rx="4" fill="#f6f6f8" stroke="#17171c" stroke-width="1.2"/>
  <text x="145" y="56" text-anchor="middle" font-size="11" fill="#17171c">k₁</text>
  <rect x="210" y="45" width="80" height="14" fill="#0f766e"/>
  <text x="296" y="56" font-size="9" fill="#52525b">0.50</text>
  <rect x="330" y="38" width="50" height="28" rx="4" fill="#f6f6f8" stroke="#17171c" stroke-width="1.2"/>
  <text x="355" y="56" text-anchor="middle" font-size="11" fill="#17171c">v₁</text>
  <line x1="380" y1="52" x2="466" y2="118" stroke="#0f766e" stroke-width="3.5" marker-end="url(#aa)"/>

  <!-- row 2 (yc=98) -->
  <line x1="74" y1="125" x2="120" y2="98" stroke="#b9bcc6" stroke-width="1.2"/>
  <rect x="120" y="84" width="50" height="28" rx="4" fill="#f6f6f8" stroke="#17171c" stroke-width="1.2"/>
  <text x="145" y="102" text-anchor="middle" font-size="11" fill="#17171c">k₂</text>
  <rect x="210" y="91" width="48" height="14" fill="#0f766e"/>
  <text x="264" y="102" font-size="9" fill="#52525b">0.30</text>
  <rect x="330" y="84" width="50" height="28" rx="4" fill="#f6f6f8" stroke="#17171c" stroke-width="1.2"/>
  <text x="355" y="102" text-anchor="middle" font-size="11" fill="#17171c">v₂</text>
  <line x1="380" y1="98" x2="466" y2="122" stroke="#0f766e" stroke-width="2.6" marker-end="url(#aa)"/>

  <!-- row 3 (yc=144) -->
  <line x1="74" y1="125" x2="120" y2="144" stroke="#b9bcc6" stroke-width="1.2"/>
  <rect x="120" y="130" width="50" height="28" rx="4" fill="#f6f6f8" stroke="#17171c" stroke-width="1.2"/>
  <text x="145" y="148" text-anchor="middle" font-size="11" fill="#17171c">k₃</text>
  <rect x="210" y="137" width="22" height="14" fill="#0f766e"/>
  <text x="238" y="148" font-size="9" fill="#52525b">0.14</text>
  <rect x="330" y="130" width="50" height="28" rx="4" fill="#f6f6f8" stroke="#17171c" stroke-width="1.2"/>
  <text x="355" y="148" text-anchor="middle" font-size="11" fill="#17171c">v₃</text>
  <line x1="380" y1="144" x2="466" y2="130" stroke="#0f766e" stroke-width="1.7" marker-end="url(#aa)"/>

  <!-- row 4 (yc=190) -->
  <line x1="74" y1="125" x2="120" y2="190" stroke="#b9bcc6" stroke-width="1.2"/>
  <rect x="120" y="176" width="50" height="28" rx="4" fill="#f6f6f8" stroke="#17171c" stroke-width="1.2"/>
  <text x="145" y="194" text-anchor="middle" font-size="11" fill="#17171c">k₄</text>
  <rect x="210" y="183" width="10" height="14" fill="#0f766e"/>
  <text x="226" y="194" font-size="9" fill="#52525b">0.06</text>
  <rect x="330" y="176" width="50" height="28" rx="4" fill="#f6f6f8" stroke="#17171c" stroke-width="1.2"/>
  <text x="355" y="194" text-anchor="middle" font-size="11" fill="#17171c">v₄</text>
  <line x1="380" y1="190" x2="466" y2="134" stroke="#0f766e" stroke-width="1.2" marker-end="url(#aa)"/>

  <!-- output -->
  <rect x="470" y="96" width="70" height="58" rx="6" fill="#0f766e" fill-opacity="0.10" stroke="#0f766e" stroke-width="2"/>
  <text x="505" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#0f766e">outputᵢ</text>
  <text x="505" y="138" text-anchor="middle" font-size="10.5" fill="#52525b">Σ wⱼ vⱼ</text>

  <text x="300" y="238" text-anchor="middle" font-size="11" fill="#52525b">Bigger dot product → bigger weight → that patch's value contributes more. (Weights shown are an example.)</text>
</svg>
