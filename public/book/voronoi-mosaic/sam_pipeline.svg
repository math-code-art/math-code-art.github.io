<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#52525b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#17171c">How SAM turns a prompt into a mask</text>

  <!-- inputs -->
  <rect x="20" y="70" width="150" height="52" rx="6" fill="#f6f6f8" stroke="#d0d0da" stroke-width="1.5"/>
  <text x="95" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#17171c">Image</text>
  <text x="95" y="110" text-anchor="middle" font-size="11" fill="#52525b">1024×1024×3</text>

  <rect x="20" y="205" width="150" height="60" rx="6" fill="#f6f6f8" stroke="#d0d0da" stroke-width="1.5"/>
  <text x="95" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#17171c">Prompt</text>
  <text x="95" y="247" text-anchor="middle" font-size="10.5" fill="#52525b">point · box · mask · text</text>

  <!-- encoders -->
  <rect x="235" y="66" width="175" height="60" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="322" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">Image Encoder</text>
  <text x="322" y="108" text-anchor="middle" font-size="11" fill="#52525b">ViT · runs once (heavy)</text>

  <rect x="235" y="205" width="175" height="58" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="322" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">Prompt Encoder</text>
  <text x="322" y="248" text-anchor="middle" font-size="11" fill="#52525b">cheap · re-runnable</text>

  <!-- decoder -->
  <rect x="475" y="120" width="150" height="92" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="550" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">Mask</text>
  <text x="550" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#0f766e">Decoder</text>

  <!-- outputs -->
  <rect x="675" y="95" width="105" height="46" rx="6" fill="#f6f6f8" stroke="#d0d0da" stroke-width="1.5"/>
  <text x="727" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#17171c">Mask</text>

  <rect x="675" y="192" width="105" height="46" rx="6" fill="#f6f6f8" stroke="#d0d0da" stroke-width="1.5"/>
  <text x="727" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#17171c">Score</text>

  <!-- arrows -->
  <line x1="170" y1="96" x2="232" y2="96" stroke="#52525b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="170" y1="234" x2="232" y2="234" stroke="#52525b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="410" y1="100" x2="472" y2="150" stroke="#52525b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="410" y1="232" x2="472" y2="182" stroke="#52525b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="625" y1="150" x2="672" y2="120" stroke="#52525b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="625" y1="182" x2="672" y2="212" stroke="#52525b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="400" y="312" text-anchor="middle" font-size="12" fill="#52525b">The image is encoded once; the prompt encoder and mask decoder are light enough to re-run for every new click.</text>
</svg>
